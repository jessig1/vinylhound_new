apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: vinylhound
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: worker
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: vinylhound.invalid/worker:deployment-required
          command:
            - node
            - apps/worker/dist/migrate.js
          envFrom:
            - configMapRef: { name: runtime }
            - secretRef: { name: worker-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}

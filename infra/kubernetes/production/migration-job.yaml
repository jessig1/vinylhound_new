apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: vinylhound
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: worker
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: vinylhound.invalid/worker:deployment-required
          # --experimental-transform-types: a Kubernetes command override
          # replaces the image's own CMD entirely (Dockerfile.worker's CMD,
          # not ENTRYPOINT), so this flag must be repeated here or the
          # cross-package .ts resolution this code hits (packages/*'s
          # constructor parameter properties, e.g. scan-repository.ts's
          # DatabaseCommandError) throws ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX in
          # Node's default strip-only mode -- the same bug already found and
          # fixed for the ECS equivalent (scripts/aws/run-worker-command.sh),
          # found here live during production's first real migration attempt.
          command:
            - node
            - --experimental-transform-types
            - apps/worker/dist/migrate.js
          envFrom:
            - configMapRef: { name: runtime }
            - secretRef: { name: worker-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}

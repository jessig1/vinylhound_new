version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The compiler and its lint tooling must resolve as one compatible set.
    groups:
      typescript-tooling:
        patterns:
          - typescript
          - typescript-eslint
          - "@typescript-eslint/*"
    # Major compiler migrations are deliberate: verify peer support and run
    # npm ci, check, build, and the container builds before lifting this rule.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

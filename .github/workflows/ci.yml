name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Contract compatibility against the previous deployed version
      # (ADR-0022): the PR base for pull requests, the pushed-over commit for
      # main. `npm test` above already proved this tree accepts every frozen
      # fixture; this step proves the base's consumers accept this tree's event
      # payloads and that no frozen fixture was edited in place.
      - name: Contract compatibility with the previous version
        env:
          CONTRACTS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$CONTRACTS_BASE_REF" || "$CONTRACTS_BASE_REF" =~ ^0+$ ]]; then
            echo "::notice title=Contract compatibility skipped::No previous commit to compare against (first push or forced history)."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$CONTRACTS_BASE_REF"
          npm run check:contracts
      - run: npm run build

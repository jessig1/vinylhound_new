name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Affected-workspace test/build selection (P3.5 Task 5): scopes vitest
      # and the workspace build to changed workspaces plus their dependency
      # closure, computed from git diff + each package.json's internal
      # (@vinylhound/*) dependencies. Conservatively falls back to the full
      # `npm test`/`npm run build` whenever a changed path is a root config
      # file, an unrecognized top-level path, or no base commit is resolvable
      # (see scripts/affected/README.md) — the worst case is identical to
      # today's full run, never less coverage.
      - name: Test (affected workspaces)
        env:
          AFFECTED_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$AFFECTED_BASE_REF" && ! "$AFFECTED_BASE_REF" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$AFFECTED_BASE_REF"
            npm run test:affected -- --base "$AFFECTED_BASE_REF"
          else
            echo "::notice title=Affected selection skipped::No previous commit to compare against (first push or forced history); running the full test suite."
            npm test
          fi
      # Contract compatibility against the previous deployed version
      # (ADR-0022): the PR base for pull requests, the pushed-over commit for
      # main. The step above already proved this tree accepts every frozen
      # fixture; this step proves the base's consumers accept this tree's event
      # payloads and that no frozen fixture was edited in place.
      - name: Contract compatibility with the previous version
        env:
          CONTRACTS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$CONTRACTS_BASE_REF" || "$CONTRACTS_BASE_REF" =~ ^0+$ ]]; then
            echo "::notice title=Contract compatibility skipped::No previous commit to compare against (first push or forced history)."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$CONTRACTS_BASE_REF"
          npm run check:contracts
      - name: Build (affected workspaces)
        env:
          AFFECTED_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$AFFECTED_BASE_REF" && ! "$AFFECTED_BASE_REF" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$AFFECTED_BASE_REF"
            npm run build:affected -- --base "$AFFECTED_BASE_REF"
          else
            echo "::notice title=Affected selection skipped::No previous commit to compare against (first push or forced history); running the full build."
            npm run build
          fi

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# `security-events: write` lets CodeQL and the redacted Gitleaks SARIF report
# create code-scanning alerts in GitHub's Security tab. Fork PRs still scan and
# fail their check, but GitHub intentionally withholds this permission from
# their tokens, so SARIF upload is skipped for those untrusted runs.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks examines the complete committed history, not just a PR
          # checkout, so an accidentally committed historical secret is found.
          fetch-depth: 0
      - name: Scan committed history with Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            zricethezav/gitleaks:v8.30.0 \
            detect --source=/repo --redact \
            --report-format sarif --report-path /repo/gitleaks.sarif
      - name: Publish redacted secret findings to code scanning
        if: >-
          always() && hashFiles('gitleaks.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: Fail when a secret is found
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: github/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0, AGPL-3.0
